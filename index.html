<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spelling Game</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:grid;place-items:center;background:linear-gradient(135deg,#e8f5ff,#fff1d8);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#29485e}
    .loading{width:min(520px,90vw);padding:28px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(42,62,80,.18)}
    .spinner{width:52px;height:52px;margin:0 auto 14px;border:6px solid #dce9f4;border-top-color:#2f7de1;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="https://cdn.counter.dev/script.js" data-id="825e93b6-ce99-40ef-8bcc-125f13297433" data-utcoffset="8"></script>
</head>
<body>
  <div class="loading" id="loader"><div class="spinner"></div><strong>Loading Spelling Game…</strong></div>
  <script>
  (async()=>{
    const ORIGINAL='https://cdn.jsdelivr.net/gh/limkimsze-maker/Spelling-Game@e70af201de059406b5f124366ccc69387acfe62c/index.html';
    const responsiveCSS=`
<style id="universal-display-fix">
  html,body{width:100%;height:100%;min-height:100%;overflow:hidden}
  body{min-width:0}
  #app{
    width:min(1180px,100%);
    height:100vh;
    height:100dvh;
    max-height:100dvh;
    min-height:0;
    padding:max(5px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
    gap:clamp(4px,1vh,8px)
  }
  header,.listenBar,main,footer,.brand,.promptText,.playerBoards,.playerCard{min-width:0}
  h1{font-size:clamp(17px,2.5vw,31px);overflow:hidden;text-overflow:ellipsis}
  .playerBoards{min-width:0;max-width:60%;flex:1}
  .playerCard{min-width:0}
  .modal,.danceCard{max-height:calc(100dvh - 24px);overflow:auto;-webkit-overflow-scrolling:touch}
  #loadingScreen,#startScreen,#teacherPanel,#winnerScreen,#missionDanceScreen{
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))
  }

  @media(max-width:900px){
    #app{width:100%}
    header{gap:7px}
    .brand{flex:1}
    .playerBoards{max-width:58%;gap:5px}
    .playerCard{width:auto;flex:1;max-width:none}
  }

  @media(max-width:760px){
    #app{padding:5px;gap:5px}
    header{padding:6px 8px;gap:6px}
    .logo{width:36px;height:36px;font-size:21px;border-radius:11px;flex:0 0 auto}
    h1{font-size:clamp(16px,4.4vw,22px);white-space:normal;line-height:1.05}
    .sub{display:none}
    .playerBoards{max-width:56%;gap:4px}
    .playerCard{padding:4px 5px;border-radius:11px}
    .playerName{font-size:10px}.playerScore{font-size:9px}.coverageTrack{height:8px}.coverageText{display:none}
    .missionRoadmap{margin:0 4px 5px;padding:4px 6px;gap:5px}
    .roadmapName{display:none}.missionStars{gap:4px}.missionStar{font-size:22px}
    .listenBar{grid-template-columns:auto minmax(0,1fr) auto;padding:6px;gap:5px;border-radius:14px}
    .hearBtn{padding:9px 10px;font-size:14px;white-space:normal;line-height:1.05}
    .sentenceBtn{padding:8px;font-size:10px;white-space:normal}
    .promptTitle{font-size:clamp(12px,3.4vw,16px);line-height:1.08}
    .promptHint{font-size:10px;line-height:1.05}
    .missionStrip{gap:4px;margin-top:3px}
    .turnBanner,.missionChip,.newCoverage{font-size:9px;padding:3px 6px}
    main{padding:6px;gap:6px;grid-template-rows:minmax(86px,36%) minmax(0,1fr)}
    #syllableArea{gap:5px}
    .syllableBox{padding:26px 4px 4px;gap:4px;border-radius:13px;overflow:auto}
    .syllableBox::before{font-size:9px;top:4px}
    .emptyHint{font-size:10px}
    #trayWrap{border-radius:13px}
    .trayHead{padding:4px 6px}.trayTitle{font-size:11px}.trayHelp{display:none}
    #phonogramTray{padding:5px;gap:5px;overflow:auto}
    .tile{min-width:43px;height:43px;padding:0 8px;border-radius:11px;font-size:clamp(18px,4.8vw,25px)}
    .tile.placed{min-width:40px;height:39px;font-size:clamp(17px,4.5vw,23px)}
    footer{grid-template-columns:minmax(0,1fr) auto;gap:5px}
    #feedback{font-size:11px;line-height:1.12;overflow:hidden}
    .actions{gap:5px}.smallBtn{padding:7px 8px;font-size:11px}.mainBtn{min-width:90px;padding:8px 10px;font-size:13px}
    .rightTools{display:none}
  }

  @media(max-width:520px) and (orientation:portrait){
    header{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
    .brand{justify-content:center;text-align:center}
    .playerBoards{width:100%;max-width:none;gap:4px}
    .playerCard{flex:1;width:auto;max-width:none}
    .listenBar{grid-template-columns:auto minmax(0,1fr) auto}
    .hearBtn{font-size:12px;padding:7px 8px;max-width:86px}
    .sentenceBtn{font-size:9px;padding:6px;max-width:64px}
    .promptTitle{font-size:12px}
    .promptHint{display:none}
    .missionStrip{gap:3px;margin-top:2px}
    .turnBanner,.missionChip,.newCoverage{font-size:8.5px;padding:2px 5px}
    main{grid-template-rows:minmax(76px,33%) minmax(0,1fr)}
    .tile{min-width:39px;height:40px;padding:0 7px;font-size:clamp(17px,5.5vw,23px)}
    .tile.placed{min-width:37px;height:37px;font-size:clamp(16px,5.1vw,21px)}
    .modal{width:min(640px,96vw);padding:15px;border-radius:18px}
    .modal h2{font-size:24px}.modal p{font-size:13px}
    .nameGrid{gap:7px;margin:9px 0}.rulesBox{font-size:11px;padding:8px;line-height:1.35}
    .bigStart{font-size:17px;padding:11px 18px}
  }

  @media(max-height:700px){
    #app{padding:4px 6px;gap:4px}
    header{padding:4px 7px;border-radius:12px}
    .logo{width:32px;height:32px;font-size:19px}.sub{display:none}
    h1{font-size:17px}
    .playerCard{padding:3px 5px}.coverageLine{margin-top:2px}
    .missionRoadmap{margin:0 4px 3px;padding:2px 5px;border-radius:10px}
    .missionStar{font-size:19px}.missionStars{gap:3px}
    .listenBar{padding:4px 6px;gap:4px;border-radius:11px}
    .hearBtn{padding:6px 9px;font-size:12px}.sentenceBtn{padding:6px 8px;font-size:9px}
    .promptTitle{font-size:12px}.promptHint{display:none}
    .missionStrip{margin-top:1px;gap:3px}.turnBanner,.missionChip,.newCoverage{padding:2px 5px;font-size:8.5px}
    main{padding:5px;gap:4px;border-radius:12px;grid-template-rows:minmax(68px,32%) minmax(0,1fr)}
    .syllableBox{padding:22px 4px 4px;border-radius:10px}.syllableBox::before{font-size:8px;top:3px}
    .trayHead{padding:3px 5px}.trayTitle{font-size:10px}.trayHelp{display:none}
    #phonogramTray{padding:4px;gap:4px}
    .tile{height:38px;min-width:39px;padding:0 7px;font-size:18px;border-radius:9px}
    .tile.placed{height:35px;min-width:36px;font-size:17px}
    footer{gap:4px}.mainBtn{min-width:82px;padding:6px 9px;font-size:12px}.smallBtn{padding:6px 7px;font-size:10px}
    #feedback{font-size:10px}
  }

  @media(max-height:520px){
    #app{gap:3px;padding:3px 5px}
    header{padding:3px 6px}.logo{display:none}
    h1{font-size:15px;white-space:nowrap}.brand{gap:4px}
    .playerName{font-size:9px}.playerScore{font-size:8px}.coverageTrack{height:6px}
    .missionRoadmap{display:none}
    .listenBar{padding:3px 5px}.hearBtn{padding:5px 7px;font-size:10px}.sentenceBtn{padding:5px 6px;font-size:8px}
    .promptTitle{font-size:10px}.missionChip{display:none}
    main{padding:4px;gap:3px;grid-template-rows:minmax(58px,29%) minmax(0,1fr)}
    .syllableBox{padding:18px 3px 3px}.syllableBox::before{font-size:7px}
    .trayHead{padding:2px 4px}.trayTitle{font-size:9px}
    #phonogramTray{padding:3px;gap:3px}
    .tile{height:32px;min-width:34px;padding:0 6px;font-size:16px;box-shadow:0 2px 0 #c9d8e3}
    .tile.placed{height:30px;min-width:32px;font-size:15px}
    footer{gap:3px}.mainBtn{min-width:72px;padding:5px 7px;font-size:10px}.smallBtn{padding:5px 6px;font-size:9px}
    #feedback{font-size:9px}
  }

  @media(min-width:1400px){#app{width:min(1320px,100%)}}
</style>`;

    try{
      const response=await fetch(ORIGINAL,{cache:'force-cache'});
      if(!response.ok) throw new Error('Could not load game source');
      let html=await response.text();
      html=html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,'<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />');
      html=html.replace('</head>',responsiveCSS+'\n</head>');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.getElementById('loader').innerHTML='<strong>Unable to load the Spelling Game.</strong><br><small>Please refresh the page and try again.</small>';
    }
  })();
  </script>
</body>
</html>
