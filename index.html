<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spelling Game</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{display:grid;place-items:center;background:linear-gradient(135deg,#e8f5ff,#fff1d8);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#29485e}
    .loading{width:min(520px,90vw);padding:28px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(42,62,80,.18)}
    .spinner{width:52px;height:52px;margin:0 auto 14px;border:6px solid #dce9f4;border-top-color:#2f7de1;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading" id="loader"><div class="spinner"></div><strong>Loading Spelling Game…</strong></div>
  <script>
  (async()=>{
    const STABLE_WRAPPER='https://raw.githubusercontent.com/limkimsze-maker/Spelling-Game/07e9499cfd626c14715fc956e2fb7e14fda749b4/index.html';
    const PATCH='https://raw.githubusercontent.com/limkimsze-maker/Spelling-Game/main/game-patch.js?v=20260816g';
    const ADJUST='https://raw.githubusercontent.com/limkimsze-maker/Spelling-Game/main/bank-adjustment-v2.js?v=20260816a';
    const CREDIT='https://raw.githubusercontent.com/limkimsze-maker/Spelling-Game/main/credit.js?v=20260816b';
    const MATCH='https://raw.githubusercontent.com/limkimsze-maker/Spelling-Game/main/match-celebration.js?v=20260816a';
    const TEAMWORK='https://raw.githubusercontent.com/limkimsze-maker/Spelling-Game/main/teamwork.js?v=20260816c';
    try{
      const r=await fetch(STABLE_WRAPPER,{cache:'no-store'});
      if(!r.ok) throw new Error('Could not load stable game wrapper');
      let shell=await r.text();

      const injection=[
        "      const patchResponse=await fetch('"+PATCH+"',{cache:'no-store'});",
        "      const adjustResponse=await fetch('"+ADJUST+"',{cache:'no-store'});",
        "      const creditResponse=await fetch('"+CREDIT+"',{cache:'no-store'});",
        "      const matchResponse=await fetch('"+MATCH+"',{cache:'no-store'});",
        "      const teamworkResponse=await fetch('"+TEAMWORK+"',{cache:'no-store'});",
        "      const internalPatch=patchResponse.ok?await patchResponse.text():'';",
        "      const adjustmentPatch=adjustResponse.ok?await adjustResponse.text():'';",
        "      const creditPatch=creditResponse.ok?await creditResponse.text():'';",
        "      const matchPatch=matchResponse.ok?await matchResponse.text():'';",
        "      const teamworkPatch=teamworkResponse.ok?await teamworkResponse.text():'';",
        "      const combinedPatch=internalPatch+'\\n'+adjustmentPatch+'\\n'+creditPatch+'\\n'+matchPatch+'\\n'+teamworkPatch;",
        "      if(combinedPatch.trim()){",
        "        html=html.replace('  setMode(1,true);\\n  loadProgress();loadCorpus();',combinedPatch+'\\n\\n  setMode(1,true);\\n  loadProgress();loadCorpus();');",
        "      }"
      ].join('\n');

      shell=shell.replace('      let html=await response.text();','      let html=await response.text();\n'+injection);
      // The comprehensive patches are inserted inside the game so they can access
      // the game's local state, word bank and coverage functions safely.
      shell=shell.replace(/      const morphologyScript=.*?;\n/,"      const morphologyScript='';\n");

      document.open();
      document.write(shell);
      document.close();
    }catch(err){
      document.getElementById('loader').innerHTML='<strong>Unable to load the Spelling Game.</strong><br><small>Please refresh the page and try again.</small>';
    }
  })();
  </script>
</body>
</html>
