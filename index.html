<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spelling Game</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:grid;place-items:center;background:linear-gradient(135deg,#e8f5ff,#fff1d8);font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;color:#29485e}
    .loading{width:min(520px,90vw);padding:28px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(42,62,80,.18)}
    .spinner{width:52px;height:52px;margin:0 auto 14px;border:6px solid #dce9f4;border-top-color:#2f7de1;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="https://cdn.counter.dev/script.js" data-id="825e93b6-ce99-40ef-8bcc-125f13297433" data-utcoffset="8"></script>
</head>
<body>
  <div class="loading" id="loader"><div class="spinner"></div><strong>Loading Spelling Game…</strong><br><small>Preparing a fresh progressive mission.</small></div>
  <script>
  (async()=>{
    // Use the last complete version as the stable base, then add only the
    // syllable-progression layer. This preserves Random Mission, fresh themes,
    // responsive layout, scoring, saved progress and the 60-word rules.
    const BASE='https://cdn.jsdelivr.net/gh/limkimsze-maker/Spelling-Game@696c23181f2211e4f420ab8226a2c81338478a3d/index.html';

    const progressionBridge=`<script id="progressive-difficulty-bridge">
(()=>{
  const nativeWrite=Document.prototype.write;
  let armed=true;

  const progressiveJS=\`<script id="progressive-syllable-difficulty">
(()=>{
  // Difficulty is a preference, never a hard restriction. Missing phonogram
  // coverage always has priority over syllable length.
  const profiles={
    1:{1:48,2:5,3:-28,4:-48},
    2:{1:36,2:24,3:-15,4:-34},
    3:{1:22,2:36,3:2,4:-22},
    4:{1:5,2:42,3:20,4:-5},
    5:{1:-12,2:34,3:38,4:16},
    6:{1:-24,2:25,3:46,4:34}
  };

  function currentDifficultyMission(){
    if(state.mode===2){
      const missions=state.players.map(p=>Math.max(1,Math.min(6,Number(p.mission)||1)));
      return Math.max(1,Math.min(6,Math.min(...missions)));
    }
    const p=state.players[state.currentPlayer]||state.players[0];
    return Math.max(1,Math.min(6,Number(p?.mission)||1));
  }

  function syllableCount(w){
    return Math.max(1,Array.isArray(w?.syllables)?w.syllables.length:1);
  }

  function progressionValue(w,mission){
    const s=syllableCount(w);
    const p=profiles[mission]||profiles[1];
    const base=p[Math.min(4,s)] ?? p[4];
    // In later missions, very long words get a small extra lift; in early
    // missions they remain possible only when coverage needs them.
    const extra=s>4 ? (mission>=5 ? (s-4)*5 : -(s-4)*10) : 0;
    return base+extra;
  }

  function tilesIn(w){
    return (w?.syllables||[]).reduce((sum,s)=>sum+(s.letters||[]).length,0);
  }

  function chooseProgressive(candidates,remaining,coverageFirst){
    if(!candidates.length) return null;
    const mission=currentDifficultyMission();
    const scored=candidates.map(w=>{
      const keys=wordTokenKeys(w);
      const fresh=keys.filter(k=>remaining.has(k)).length;
      // Coverage dominates. Difficulty shapes the choice only among words
      // that are similarly useful for phonogram coverage.
      const score=(coverageFirst?fresh*10000:0)+progressionValue(w,mission)*80-tilesIn(w)*.35+Math.random()*42;
      return {w,fresh,score};
    }).sort((a,b)=>b.score-a.score);

    if(coverageFirst && scored[0]?.fresh>0){
      const bestFresh=scored[0].fresh;
      const sameCoverage=scored.filter(x=>x.fresh===bestFresh).slice(0,8);
      const topScore=sameCoverage[0]?.score??0;
      const close=sameCoverage.filter(x=>x.score>=topScore-120).slice(0,5);
      const pool=close.length?close:sameCoverage;
      return pool[Math.floor(Math.random()*pool.length)]?.w||scored[0].w;
    }

    const topScore=scored[0]?.score??0;
    const close=scored.filter(x=>x.score>=topScore-150).slice(0,8);
    const pool=close.length?close:scored.slice(0,5);
    return pool[Math.floor(Math.random()*pool.length)]?.w||scored[0].w;
  }

  chooseCoverageWord=function(player){
    if(randomMissionQueue.length){
      const queued=randomMissionQueue.shift();
      if(queued) return queued;
    }

    const allKeys=state.allTokens.map(tokenKey);
    const globalUsedWords=new Set(state.players.flatMap(p=>[...p.usedWords].map(x=>String(x).toLowerCase())));
    const presentedCoverage=new Set();
    state.words.forEach(w=>{
      if(globalUsedWords.has(String(w.word).toLowerCase())){
        wordTokenKeys(w).forEach(k=>presentedCoverage.add(k));
      }
    });
    const remaining=new Set(allKeys.filter(k=>!presentedCoverage.has(k)));
    const unused=state.words.filter(w=>!globalUsedWords.has(String(w.word).toLowerCase()));
    if(!unused.length) return null;

    if(remaining.size){
      let coveragePool=state.challengeWords.filter(w=>
        !globalUsedWords.has(String(w.word).toLowerCase()) &&
        wordTokenKeys(w).some(k=>remaining.has(k))
      );
      if(!coveragePool.length){
        coveragePool=unused.filter(w=>wordTokenKeys(w).some(k=>remaining.has(k)));
      }
      if(coveragePool.length){
        return chooseProgressive(coveragePool,remaining,true);
      }
    }

    return chooseProgressive(unused,remaining,false);
  };

  buildRandomMissionQueue=function(){
    const allKeys=state.allTokens.map(tokenKey);
    const globalUsedWords=new Set(state.players.flatMap(p=>[...p.usedWords].map(x=>String(x).toLowerCase())));
    const presentedCoverage=new Set();
    state.words.forEach(w=>{
      if(globalUsedWords.has(String(w.word).toLowerCase())){
        wordTokenKeys(w).forEach(k=>presentedCoverage.add(k));
      }
    });
    const remaining=new Set(allKeys.filter(k=>!presentedCoverage.has(k)));
    let available=state.words.filter(w=>{
      const key=String(w.word||'').toLowerCase();
      return !globalUsedWords.has(key) && !randomMissionRerollExclusions.has(key);
    });
    const queue=[];

    for(let slot=0;slot<10 && available.length;slot++){
      let candidates=available;
      let coverageFirst=false;
      if(remaining.size){
        const compact=state.challengeWords.filter(w=>{
          const key=String(w.word||'').toLowerCase();
          return !globalUsedWords.has(key) &&
                 !randomMissionRerollExclusions.has(key) &&
                 available.includes(w) &&
                 wordTokenKeys(w).some(k=>remaining.has(k));
        });
        const freshPool=available.filter(w=>wordTokenKeys(w).some(k=>remaining.has(k)));
        if(compact.length){candidates=compact;coverageFirst=true}
        else if(freshPool.length){candidates=freshPool;coverageFirst=true}
      }

      const pick=chooseProgressive(candidates,remaining,coverageFirst);
      if(!pick) break;
      queue.push(pick);
      available=available.filter(w=>w!==pick);
      wordTokenKeys(pick).forEach(k=>remaining.delete(k));
    }
    return queue;
  };
})();
<\\/script>\`;

  Document.prototype.write=function(...args){
    let html=args.join('');
    if(armed && html.includes('function chooseCoverageWord(player)')){
      armed=false;
      html=html.replace('</body>',progressiveJS+'\\n</body>');
    }
    return nativeWrite.call(this,html);
  };
})();
<\/script>`;

    try{
      const response=await fetch(BASE,{cache:'force-cache'});
      if(!response.ok) throw new Error('Could not load base game');
      let html=await response.text();

      // The outer page owns the tracker so it fires once only.
      html=html.replace(/\s*<script src="https:\/\/cdn\.counter\.dev\/script\.js"[^>]*><\/script>/i,'');
      html=html.replace('</body>',progressionBridge+'\n</body>');

      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.getElementById('loader').innerHTML='<strong>Unable to load the Spelling Game.</strong><br><small>Please refresh the page and try again.</small>';
    }
  })();
  </script>
</body>
</html>
